[workspace]
members = ["crates/vortex-core", "crates/vortex-bevy"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
authors = ["Nick"]
description = "Authorized Unreal and OpenUSD asset conversion pipeline for Bevy"
readme = "README.md"
keywords = ["bevy", "unreal", "usd", "gltf", "assets"]
categories = ["game-development", "graphics", "command-line-utilities"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/greysquirr3l/vortex-bevy"

[workspace.dependencies]
anyhow = "1.0.100"
bevy = { version = "0.19", default-features = false }
bevy_egui = "0.42.0"
clap = { version = "4.6.6", features = ["derive"] }
criterion = "0.5.1"
stats_alloc = "0.1.10"
ron = "0.10.1"
serde_json = "1.0.149"
gltf = { version = "1.4.1", default-features = false, features = ["names"] }
fbxcel-dom = "0.0.10"
flate2 = "1.1.5"
image = { version = "0.25.9", default-features = false, features = ["png", "tga"] }
uasset = "0.6.0"
serde = { version = "1.0.228", features = ["derive"] }
sha2 = "0.10.9"
thiserror = "2.0.17"
tracing = "0.1.44"
tracing-subscriber = "0.3.22"

[workspace.lints.rust]
unsafe_code = "forbid"
# `linker_messages` surfaces `macOS ld: __eh_frame section too large (max 16MB)` on
# Bevy/egui-heavy test binaries. The warning is a performance hint
# ("performance of exception handling might be affected"), not a correctness
# issue, and the rustc lint itself states it ignores `-D warnings`. Reducing
# the underlying eh_frame size would require `panic = "abort"` for tests,
# changing test panic semantics project-wide; per-target linker flags are not
# portable across macOS ld / GNU ld. Allow the lint here so test binaries
# still compile under `build.warnings = "deny"`.
linker_messages = "allow"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
cast_ptr_alignment = "deny"
suspicious = "deny"

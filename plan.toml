# Vortex-Bevy — Wiggum implementation plan
#
# Validate:
#   wiggum validate vortex-bevy-plan.toml --lint
# Preview:
#   wiggum generate vortex-bevy-plan.toml --dry-run
# Generate:
#   wiggum generate vortex-bevy-plan.toml

[project]
name = "vortex-bevy"
description = """
Vortex-Bevy is a Rust 1.97.1 / Bevy 0.19 asset-conversion and runtime-viewing
workspace for authorized Unreal Engine source projects and OpenUSD stages. It
inspects Unreal package metadata, invokes a minimal Unreal Editor automation
bridge for authoritative export, resolves configured USD stage views, compiles
a typed intermediate representation, packages Bevy-compatible GLB and textures,
and loads the result with source-traceable metadata in Bevy.

The product explicitly distinguishes editable source-project assets from loose,
cooked, encrypted, or proprietary payloads. It never promises functional
Blueprint/C++ conversion. It emits an actionable per-asset classification:
converted, baked, requires_adapter, unsupported, or rejected.
"""
language = "rust"
path = "/home/ubuntu/vortex-bevy"
architecture = "collapsed-ddd-hexagonal"

[preflight]
build = "cargo build --workspace --all-targets --all-features"
test = "cargo test --workspace --all-features"
lint = "cargo fmt --all -- --check && cargo l"
audit = "cargo deny --all-features check && cargo audit"

[orchestrator]
persona = """
You are a senior Rust game-tools engineer building a deterministic Unreal/USD to
Bevy asset pipeline. You understand Rust 1.97.1, edition 2024, Bevy 0.19,
OpenUSD composition, Unreal source-project export, asset serialization, GLB,
PBR, skeletal animation, and cross-platform desktop tooling. You enforce a
collapsed DDD/Hex architecture with narrow consumer-owned ports and no separate
ports crate or ports directory.
"""
strategy = "complete"
max_retries = 3
on_failure = "pause"
rules = [
    "Pin Rust exactly to 1.97.1 in rust-toolchain.toml and use edition 2024; stable only, no nightly features.",
    "Use a Cargo workspace with the minimum practical crates: crates/vortex-core as the reusable library and crates/vortex-bevy as the CLI plus Bevy runtime application. Do not add a crate without a concrete dependency or build-boundary reason.",
    "Use collapsed DDD/Hex layout inside each cohesive crate: src/domain, src/application/{command,query}, and src/adapters/{primary,secondary}. Re-export focused public APIs from module roots; do not create a separate ports directory or shared ports crate.",
    "Port traits are consumer-owned: define each narrow trait in the command/query handler that calls it, with one to three methods. Concrete adapters implement the handler-local trait and never re-export it.",
    "The domain is pure: no Bevy, filesystem, subprocess, Tokio, OpenUSD, serde format, or Unreal Editor imports in domain modules. Domain logic receives time, platform facts, and conversion context explicitly.",
    "Parse untrusted CLI, filesystem, project, USD, package, and manifest inputs exactly once at primary adapter boundaries into typed value objects. Do not pass raw String values into domain or application handlers.",
    "Use thiserror for library/domain/application errors and anyhow with context only in binary entrypoints and primary adapters. Do not flatten domain errors into strings before an adapter boundary.",
    "Never use .unwrap(), .expect(), panic!, todo!(), unimplemented!(), unsafe code, or indexing/slicing that can panic in production code. Use ?, explicit matches, get, checked arithmetic, and typed errors. Clap’s own parse exit behavior is the sole accepted CLI exception.",
    "Run the full strict Clippy profile. Do not add #[allow(clippy::...)] suppressions. Use #[expect(...)] only when an unavoidable, documented lint is expected and retain a reason.",
    "Prefer .is_multiple_of(n) to modulo equality checks, LazyLock/LazyCell to lazy_static!, checked conversions over as casts, Arc::clone for genuine shared ownership, and owned data over contagious lifetime parameters. Clone small immutable values when that is clearer than lifetime gymnastics.",
    "Avoid async traits unless an actual asynchronous boundary requires one. If a port must be dynamically dispatched and async, use an explicit object-safe boxed future or a concrete adapter; do not add async-trait by reflex.",
    "Treat every conversion as deterministic and idempotent. Derive stable output paths and IDs from typed source identities and export profile. Do not depend on wall-clock time, unordered HashMap iteration, or process-global mutable state in generated artifacts.",
    "Use GLB plus a versioned scene.manifest.ron sidecar as the first runtime contract. Preserve source package path, Unreal object path, USD prim path, selected variant state, warnings, and conversion class; never silently drop unsupported source features.",
    "Editable .uproject input uses the matching Unreal Editor as the authoritative source decoder. The only permitted Python is a minimal, isolated Unreal Editor automation script because AssetExportTask is the official bridge; Rust remains the product core. Do not introduce Python elsewhere.",
    "Cooked, encrypted, unowned, or DRM-protected inputs are out of scope by default. Detect and report the condition; do not bypass encryption, keys, licensing, or access controls.",
    "Bevy 0.19 code uses the current APIs: WorldAssetRoot and GltfAssetLabel for GLB scene spawning; FontSize::Px and FontSource where text is present; resources-as-components semantics; and Bevy 0.19-compatible crate versions only.",
    "Validate every GLB against Bevy’s supported glTF subset. Reject or transform unsupported compression, instancing, variants, shader extensions, and unsupported texture-transform usage with explicit manifest diagnostics.",
    "Tests must use owned or synthetic fixtures only. Never commit licensed Unreal Marketplace assets, game assets, encryption keys, proprietary .uasset payloads, or generated binaries without explicit authorization.",
    "Use conventional commits, GitHub Actions CI, Coraline for code navigation, and direct safe edit operations. Never force-add ignored files and never use truncation-prone shell rewrite patterns.",
    "Before removing a cargo-deny ignore, run cargo deny --all-features check with a fresh network advisory database and confirm the advisory is absent from the resolved graph.",
    "Optimize only after measuring. Use concrete types in hot conversion/Bevy paths; do not introduce trait objects or Arc in tight per-vertex loops without evidence."
]

[evaluator]
persona = """
You are a skeptical Rust game-tools QA engineer. Verify claims against the
workspace, the generated artifacts, owned fixtures, and the actual Bevy 0.19
runtime. Reject partial conversion, metadata loss, non-determinism, unwired
adapters, hidden panic paths, and architectural boundary violations.
"""
pass_threshold = 8
hard_fail = true
test_tool = "cargo test --workspace --all-features"
mode = "blocking"
contract_review = true

[[evaluator.criteria]]
name = "tests-and-fixtures"
weight = 25
description = "All workspace tests pass; fixture-based tests cover success, malformed input, unsupported features, and failure reporting for the task’s boundary."

[[evaluator.criteria]]
name = "strict-quality"
weight = 25
description = "Formatting, the complete Nick Clippy profile, cargo-deny, and cargo-audit pass with no warnings or unjustified suppressions."

[[evaluator.criteria]]
name = "architecture-and-error-boundaries"
weight = 20
description = "Pure domain boundaries hold, ports remain narrow and consumer-owned, raw strings do not leak past adapters, and production code has no unwrap/expect/panic/index slicing."

[[evaluator.criteria]]
name = "determinism-and-traceability"
weight = 15
description = "Output is deterministic and idempotent; manifests preserve typed source identity, conversion profile, classification, diagnostics, and provenance."

[[evaluator.criteria]]
name = "runtime-and-documentation"
weight = 15
description = "The feature is wired through the CLI or Bevy application, public APIs have rustdoc/examples where appropriate, and user-facing documentation matches actual behavior."

[security]
skip_hardening_task = false

[integration]
skip_wiring_audit = false
skip_stub_audit = false

[targets]
vscode = true
opencode = true
claude = true
agent-rules = true

[style]
avoid_ai_patterns = true
avoid_god_files = true
strict = true
completion_standard = """
Every task ships only when the root fix is complete, not when a narrow happy path
compiles. Preflight passes with zero errors and zero warnings; all stated
must-haves and evaluation criteria are demonstrably true; success, malformed,
unsupported, and failure paths are tested; user-facing docs and fixture notes
are updated; generated artifacts are deterministic; and no production stubs,
todo!(), unimplemented!(), placeholder defaults, #[allow(...)] suppressions,
unwrap(), expect(), panic!(), or unchecked indexing remain. The task must leave
the workspace more coherent than it found it and update PROGRESS.md with verified
codebase state and durable learnings.
"""

# ─── Phase 1: Repository and Toolchain Foundation ─────────────────────────────

[[phases]]
name = "Repository and Toolchain Foundation"
order = 1

[[phases.tasks]]
slug = "workspace-foundation"
kind = "infrastructure"
title = "Pin the Rust 1.97.1 workspace and collapsed architecture"
goal = "Create the Vortex-Bevy Cargo workspace, exact stable toolchain pin, minimal crate topology, cross-platform repository hygiene, and a compiling no-feature baseline."
depends_on = []
hints = [
    "Create rust-toolchain.toml pinned to channel = \"1.97.1\" with rustfmt and clippy components; set Cargo.toml rust-version = \"1.97.1\", edition = \"2024\", and resolver = \"3\".",
    "Create only crates/vortex-core (library) and crates/vortex-bevy (binary plus Bevy runtime). Keep the first crate’s structure at src/{domain,application/{command,query},adapters/{primary,secondary}}. The binary owns CLI and Bevy primary adapters.",
    "Create typed module boundaries and no-op composition roots rather than placeholder production functions. Do not use a ports/ directory or ports crate.",
    "Add .gitignore for target/, .vscode generated output as appropriate, Unreal Saved/, Intermediate/, DerivedDataCache/, Binaries/, user-specific editor files, local fixture output, and secrets. Do not ignore fixture source manifests or test metadata.",
    "Add README.md with project purpose, owned-input/legal boundary, architecture sketch, supported-input promise, and developer bootstrap commands.",
    "Add .cargo/config.toml with the exact cargo l alias from Nick’s standards, build.warnings configuration, checked cfg support where applicable, and cross-platform-safe command assumptions.",
    "Add rustfmt.toml only for stable supported options; never depend on nightly formatting settings."
]
test_hints = [
    "cargo build --workspace --all-targets --all-features succeeds on the empty composition roots.",
    "A workspace-layout test or compile-time module test proves vortex-core does not depend on Bevy or application adapters."
]
must_haves = [
    "rust-toolchain.toml pins 1.97.1 exactly",
    "Cargo workspace has exactly two initial product crates with documented responsibilities",
    "Edition 2024 and rust-version 1.97.1 are declared",
    "Collapsed DDD/Hex folders exist without a ports directory",
    "README states the editable-source-project-first and authorization boundary",
    "cargo l runs Nick’s complete strict Clippy command"
]
evaluation_criteria = [
    "cargo +1.97.1 build --workspace --all-targets --all-features passes",
    "The dependency graph shows vortex-core has no Bevy dependency",
    "The repository contains no ignored files force-added to version control",
    "cargo l ends with -D warnings and includes all, pedantic, nursery, cargo, and perf lint groups"
]

[[phases.tasks]]
slug = "quality-ci-and-hooks"
kind = "infrastructure"
title = "Install quality gates, CI, security checks, and conventional commits"
goal = "Make every change reproducibly enforce Rust quality, fixture safety, licensing checks, and cross-platform compatibility before feature work begins."
depends_on = ["workspace-foundation"]
hints = [
    "Add GitHub Actions CI for Ubuntu, macOS Apple Silicon-compatible configuration, and Windows. Run cargo fmt --check, cargo l, cargo test --workspace --all-features, cargo deny --all-features check, and cargo audit.",
    "Add CodeQL for Rust, Dependabot, deny.toml for licenses/advisories/bans/sources, and document the fresh-advisory-db requirement for cargo-deny changes.",
    "Add gitleaks configuration and repository hooks for fmt, gitleaks, cargo audit, conventional commit validation, tests, lint, release build, and rustdoc. Hooks must remain optional developer tooling; CI is the source of truth.",
    "Use least-privilege GitHub workflow permissions. Do not use pull_request_target. Do not add unsafe workflow_run privilege chains.",
    "Add a fixture provenance policy that prohibits proprietary game assets, Marketplace assets, keys, and real project payloads without express authorization.",
    "Create a conventional-commit validator with the documented 72-character subject limit."
]
test_hints = [
    "Validate all workflow YAML and run local static checks where available.",
    "Add a fixture-policy test or CI grep that rejects .pak, .utoc, .ucas, .uexp, .ubulk, common key-file names, and oversized binaries outside approved test fixture locations."
]
must_haves = [
    "CI covers build, strict lint, tests, cargo-deny, cargo-audit, and CodeQL",
    "Workflow permissions are least-privilege",
    "Conventional commits are documented and locally validated",
    "Fixture provenance and binary-size policy is enforced"
]
evaluation_criteria = [
    "CI matrix commands exactly match or exceed the plan preflight",
    "No workflow uses pull_request_target or broad write permissions without documented necessity",
    "deny.toml contains license, advisory, ban, and source policy",
    "A deliberately disallowed fixture path is rejected by the policy check"
]

[[phases.tasks]]
slug = "fixture-contract"
kind = "infrastructure"
title = "Define deterministic owned fixture contracts and golden artifact rules"
goal = "Create synthetic and self-authored fixture families that support the entire converter without depending on proprietary Unreal or game content."
depends_on = ["quality-ci-and-hooks"]
hints = [
    "Create fixtures/{minimal_usda,minimal_usdc,malformed,unsupported,expected} with small self-authored geometry, PBR material factors, transforms, camera, lights, animation samples, and deliberate unsupported cases.",
    "Create JSON or RON fixture manifests that record ownership, source version, intended behavior, expected class, and checksum. Keep binary USD samples small and generated from checked-in text sources or a documented reproducible generator.",
    "Add synthetic Unreal package-header byte fixtures only if their provenance and version are documented. Prefer unit-level byte builders for parser tests over opaque blobs.",
    "Define canonical comparison: stable ordering, normalized slash paths, LF line endings, no wall-clock timestamps, and SHA-256 output checksums.",
    "Create a fixture README explaining which tests exercise source project export, USD parsing, GLB packaging, Bevy loading, malformed data, and unsupported data."
]
test_hints = [
    "Golden fixture tests run twice and produce byte-identical manifest and GLB outputs where the format permits deterministic serialization.",
    "Malformed and unsupported fixtures must yield typed diagnostics, never a panic or silent omission."
]
must_haves = [
    "Every fixture has provenance and an expected result",
    "Golden comparison normalizes nondeterministic inputs",
    "Malformed and unsupported fixture families exist",
    "No proprietary assets or keys are committed"
]
evaluation_criteria = [
    "Running fixture generation twice produces the same checksums",
    "Every binary fixture has a documented textual source or ownership statement",
    "Unsupported fixture tests assert a visible conversion-report entry"
]

# ─── Phase 2: Core Domain and Application Contracts ───────────────────────────

[[phases]]
name = "Core Domain and Application Contracts"
order = 2

[[phases.tasks]]
slug = "conversion-domain"
kind = "feature"
title = "Model conversion identities, profiles, classifications, and diagnostics"
goal = "Implement a pure domain model for source identity, conversion policy, output identity, classification, diagnostics, and deterministic conversion state transitions."
depends_on = ["fixture-contract"]
hints = [
    "Define parsed value objects such as ProjectRoot, SourceAssetPath, UnrealObjectPath, UsdPrimPath, StageSelection, OutputRoot, ExportProfileName, ConversionId, ArtifactHash, and DiagnosticCode. Parse using FromStr/TryFrom at adapters.",
    "Use enums and newtypes rather than free-form strings in domain internals. Derive Copy for small scalar/UUID/path-index IDs where semantically valid; retain owned data where it prevents lifetime leakage.",
    "Define ConversionClassification as Converted, Baked, RequiresAdapter, Unsupported, and Rejected, with an explicit reason and remediation text.",
    "Define pure aggregate/state-machine methods for beginning, recording artifacts, attaching diagnostics, classifying, and finalizing a conversion. Pass ConversionContext and time explicitly; do not read environment or clocks from domain code.",
    "Use thiserror error enums with actionable variants for invariant violations, invalid identities, conflicting artifacts, and illegal transitions."
]
test_hints = [
    "Unit-test valid and invalid parsing for every value object boundary.",
    "Test all conversion state transitions, duplicate artifact rejection, deterministic identity derivation, and every classification outcome.",
    "Use assert_matches!/debug_assert_matches! where they improve failure output."
]
must_haves = [
    "Domain has zero Bevy, filesystem, subprocess, serde-format, async runtime, or Unreal Editor dependencies",
    "No raw String crosses from primary adapters into domain handlers",
    "Classification is explicit and cannot be silently omitted",
    "All transition rules are deterministic pure methods"
]
evaluation_criteria = [
    "Dependency and import checks prove domain purity",
    "Invalid source paths and prim paths return typed errors rather than panicking",
    "Domain tests cover every ConversionClassification and terminal state"
]

[[phases.tasks]]
slug = "application-commands-and-queries"
kind = "feature"
title = "Create narrow consumer-owned conversion use cases"
goal = "Implement typed command/query handlers for inspection, planning, conversion, report retrieval, and deterministic artifact verification using narrow handler-local ports."
depends_on = ["conversion-domain"]
hints = [
    "Create command modules such as inspect_input, plan_conversion, execute_conversion, verify_artifacts, and clean_output; create query modules such as conversion_report and support_matrix.",
    "Each handler owns the smallest trait it needs: for example PackageMetadataReader, EditorExportRunner, StageResolver, ArtifactStore, and ArtifactReader. Keep methods synchronous unless an actual external adapter demands asynchronous work.",
    "Do not make domain repository traits. Do not create shared trait crates. Compose narrow traits only inside a handler when truly needed.",
    "Use typed command structs and result structs. Idempotency is represented by a first-class ConversionId and profile hash: check existing compatible artifact, execute only when needed, then persist/report the result.",
    "Keep transaction or atomic-write machinery inside adapters. Application code sees stable domain/application outcomes, not file handles or transactions."
]
test_hints = [
    "Use in-memory fake adapters in handler tests; assert exact calls, idempotent replay behavior, and error mapping.",
    "Test that an unsupported source results in a report and no partial artifact publication.",
    "Test that the same typed command yields the same plan and output identity."
]
must_haves = [
    "Ports are local to consuming handlers and have no more than three methods",
    "Commands and queries expose typed boundary contracts",
    "Idempotent execute flow is check → execute → atomically publish result",
    "Application layer does not depend directly on concrete filesystem, Editor, USD, or Bevy types"
]
evaluation_criteria = [
    "A fake-adapter test proves each handler can run without real infrastructure",
    "No adapter module exports a shared port trait",
    "Repeat execution with the same ConversionId does not duplicate artifacts or report entries"
]

[[phases.tasks]]
slug = "manifest-contract"
kind = "feature"
title = "Specify the versioned scene manifest and compatibility contract"
goal = "Define the stable scene.manifest.ron contract that carries provenance and conversion behavior beyond glTF while remaining safe and forward-compatible."
depends_on = ["conversion-domain", "application-commands-and-queries"]
hints = [
    "Use a versioned manifest root with schema_version, converter_version, profile_hash, artifact hashes, source identities, selection state, classifications, diagnostics, and compatibility requirements.",
    "Model each source reference as typed data: package path, Unreal object path, USD prim path, asset kind, selected variant values, and explicit mapping to GLB node/material/clip labels when applicable.",
    "Design unsupported-feature records for Blueprints/C++, Niagara, Chaos, Landscape, Nanite, Lumen, static lightmaps, sequencer-specific behavior, custom shader graphs, MDL, and arbitrary USD composition that cannot be recreated.",
    "Use safe deserialization with explicit size limits and schema-version checks. Never deserialize arbitrary data into executable behavior.",
    "Document backward-compatibility and migration policy before the first artifact ships."
]
test_hints = [
    "Round-trip serialize/deserialize valid manifests.",
    "Test future version, unknown required capability, oversized manifest, path traversal-like asset reference, duplicate source identity, and malformed RON failures.",
    "Golden-test canonical manifests for stable ordering and no time-dependent fields."
]
must_haves = [
    "Manifest schema is versioned and documented",
    "Source provenance and diagnostics survive GLB packaging",
    "Unknown required schema versions fail clearly and safely",
    "No manifest field evaluates scripts or code"
]
evaluation_criteria = [
    "A manifest round trip preserves all source identities and classifications",
    "Malformed/future-version input returns a typed error without panic",
    "Golden manifests are byte-stable after canonicalization"
]

# ─── Phase 3: Input Adapters and Canonical Representation ─────────────────────

[[phases]]
name = "Input Adapters and Canonical Representation"
order = 3

[[phases.tasks]]
slug = "cli-and-input-boundaries"
kind = "feature"
title = "Build a typed CLI for inspect, plan, convert, verify, and view"
goal = "Expose the product through a clear clap CLI that parses all user input into typed commands and gives actionable non-panicking errors."
depends_on = ["application-commands-and-queries", "manifest-contract"]
hints = [
    "Implement subcommands: inspect, plan, convert, verify, view, support-matrix, and version. Use typed clap value parsers or TryFrom conversions; do not pass clap String fields into application handlers.",
    "Support inputs for --project, --asset, --stage, --profile, --output, --engine, --variant, --payload-policy, --dry-run, and --overwrite only where each is meaningful.",
    "Use anyhow::Context in the binary for filesystem/process context. Map application errors to stable exit codes and human-readable remediation without leaking secrets or internal paths unnecessarily.",
    "Define an output mode for human text and a typed machine report mode. Do not depend on terminal color for correctness.",
    "Keep CLI primary adapters in vortex-bevy; core handlers remain Bevy-free."
]
test_hints = [
    "Integration-test every subcommand’s help, valid invocation, malformed value, missing path, unsupported input, and stable exit behavior.",
    "Assert that malformed --variant and --profile input fails in the CLI boundary before handler execution."
]
must_haves = [
    "All commands use typed parsed contracts",
    "Invalid subcommands and values return clear guidance without panic",
    "Machine reports contain classification and diagnostics",
    "No raw clap strings leak into vortex-core handlers"
]
evaluation_criteria = [
    "CLI integration tests cover valid and invalid input paths",
    "A handler spy proves invalid secondary parsing never reaches application code",
    "cargo run -p vortex-bevy -- support-matrix produces a documented support contract"
]

[[phases.tasks]]
slug = "uasset-inspection"
kind = "feature"
title = "Implement Rust-first Unreal package inspection and preflight"
goal = "Use a version-pinned Rust package reader behind an adapter to inspect authorized .uasset metadata, identify dependencies and companion-file requirements, classify input eligibility, and produce a deterministic inspection report."
depends_on = ["cli-and-input-boundaries"]
hints = [
    "Evaluate and pin jorgenpt/uasset-rs behind the secondary adapter boundary. Keep its types out of domain/application public contracts.",
    "Inspect package header, names, imports, exports, object classes, engine/custom versions, package flags, expected companion paths, and source identity without attempting to decode every UObject payload.",
    "Detect loose package, editable source project context, cooked-style companion files, .pak/.utoc/.ucas context, missing companions, incompatible versions, and unknown asset classes. Emit explicit classifications and remediation.",
    "Never decrypt, guess keys, bypass access controls, or claim that a cooked/encrypted file is safely convertible. Detect and reject by default.",
    "Use safe path handling: canonicalize within the authorized project root, reject traversal and symlink escape, enforce size limits, and avoid loading huge payloads during metadata preflight."
]
test_hints = [
    "Test self-authored synthetic package headers for supported, missing-companion, incompatible-version, malformed, unknown-class, and rejected-cooked scenarios.",
    "Property-test or fuzz the metadata boundary for malformed bytes; it must return errors without panic or unbounded allocation.",
    "Test project-root escape attempts and symlink traversal handling on supported platforms."
]
must_haves = [
    "uasset parsing is isolated behind a secondary adapter",
    "Inspection report separates metadata knowledge from semantic conversion capability",
    "Cooked/encrypted/unowned inputs are visibly rejected by default",
    "All paths remain inside the typed authorized project root"
]
evaluation_criteria = [
    "Malformed package fixtures never panic under unit and fuzz smoke tests",
    "A preflight report includes engine/version clues, class, dependencies, and conversion eligibility",
    "Path traversal and missing companion tests fail closed"
]

[[phases.tasks]]
slug = "unreal-editor-bridge-protocol"
kind = "feature"
title = "T09a — Implement Unreal Editor bridge protocol and synthetic tests"
goal = "Implement the isolated, versioned Unreal Editor bridge protocol, Rust process adapter, typed bridge-report parser, and synthetic test suite without requiring a local Unreal Editor installation."
depends_on = ["uasset-inspection"]
hints = [
    "Keep the bridge minimal and auditable: a checked-in Unreal Python script under scripts/unreal/ plus Rust process invocation and typed report parsing. Python is allowed only here because Unreal AssetExportTask is the authoritative automation boundary.",
    "Define a versioned bridge-report contract containing source object path, asset class, chosen exporter, output files, warnings, errors, and conversion classification. Rust validates it into application contracts.",
    "Implement command construction, Editor executable discovery/configuration, explicit staging-directory confinement, subprocess outcome mapping, and protocol-version validation without executing a real Editor.",
    "Do not send project data to external services. Do not run arbitrary project scripts. Use only the version-controlled bridge script and explicit arguments.",
    "Treat Blueprint, C++, complex material graphs, Niagara, Chaos, Landscape, Nanite, Lumen, baked lightmaps, and other non-portable systems as explicit requires_adapter/unsupported entries in synthetic report fixtures."
]
test_hints = [
    "Unit-test Rust command construction, bridge-report parsing, staging-directory confinement, subprocess failure mapping, and bridge protocol version checks without requiring Unreal.",
    "Test simulated exporter success, simulated exporter error, malformed report, unsupported asset class, and a non-exportable asset class; each must yield an explicit typed report result.",
    "Test that unsafe project/staging paths are rejected before process launch."
]
must_haves = [
    "The Unreal Python surface is isolated, versioned, and documented as the only Python exception",
    "Bridge result is structured, versioned, and independently parseable",
    "Synthetic fixtures cover success, error, malformed report, and unsupported classification",
    "Subprocess commands cannot escape the authorized project or staging roots"
]
evaluation_criteria = [
    "Rust tests prove unsafe project/staging paths are rejected before process launch",
    "A fixture bridge report maps every exported item to a typed source identity",
    "The full protocol and synthetic suite run without an Unreal Editor installation"
]

[[phases.tasks]]
slug = "unreal-editor-bridge-integration"
kind = "feature"
title = "T09b — Validate authorized Unreal Editor export integration"
goal = "Run the versioned bridge against an authorized editable Unreal project and matching Editor, then verify that authoritative AssetExportTask output satisfies the bridge contract."
depends_on = ["unreal-editor-bridge-protocol"]
gate = "Confirm access to an authorized redistributable Unreal source project and the exact matching Unreal Editor version before starting this real-Editor integration task."
hints = [
    "Use Unreal Asset Registry discovery and AssetExportTask with unattended execution, explicit filename, exporter/options, error collection, and no interactive prompts.",
    "Export one deliberately small authorized static-mesh level with its supported textures, simple material-instance data, camera/light placement, and stable source object identities.",
    "Assert real bridge output conforms to the protocol implemented in T09a and uses only the approved project and controlled staging directory.",
    "Do not commit project assets, Marketplace content, encryption keys, or generated binaries. Keep real-Editor coverage opt-in and out of normal synthetic CI."
]
test_hints = [
    "Run one opt-in integration export of the approved fixture level and assert expected source IDs, artifact paths, classifications, and protocol version.",
    "Test a known non-exportable asset class from the authorized fixture project and assert an explicit requires_adapter or unsupported report entry.",
    "Verify the process is unattended and all emitted files remain inside the approved staging root."
]
must_haves = [
    "Real Editor integration is explicitly human-gated and opt-in",
    "A matching Editor exports an approved fixture level through AssetExportTask",
    "Real output conforms to the T09a bridge-report contract",
    "No proprietary project asset or key is committed"
]
evaluation_criteria = [
    "Approved real-Editor export produces source identities and artifact paths matching the protocol contract",
    "Known non-exportable input yields a visible requires_adapter or unsupported classification",
    "Normal CI remains synthetic and does not require an Unreal Editor installation"
]

[[phases.tasks]]
slug = "usd-stage-ingestion"
kind = "feature"
title = "Resolve selected OpenUSD stage configurations into typed source data"
goal = "Add a source adapter for USD stage inspection and deterministic selection of layers, references, payload policy, variants, purpose, units, axis, instancing, and time range."
depends_on = ["cli-and-input-boundaries", "manifest-contract"]
hints = [
    "Use an isolated adapter boundary for the initial OpenUSD implementation. Prefer a documented bridge to the authoritative OpenUSD runtime for composition correctness; do not make the MVP depend on an immature Rust USD implementation.",

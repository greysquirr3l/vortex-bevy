    "Bevy integration test switches a supported packaged variant and verifies entity provenance/state changes without respawning unrelated scene roots."
]
must_haves = [
    "Runtime selection is limited to explicit packaged capability modes",
    "Flattened fallback remains available and traceable",
    "Large-scene limits fail with diagnostics rather than resource exhaustion",
    "Chunk and instance identities are deterministic"
]
evaluation_criteria = [
    "Variant/instance tests prove no source selection is silently discarded",
    "Limit-exceeding fixtures fail before excessive allocation",
    "Bevy runtime retains source links after variant/chunk operations"
]

[[phases.tasks]]
slug = "direct-asset-decoder-expansion"
kind = "feature"
title = "Expand direct authorized asset decoding only where it beats Editor export"
goal = "Add direct Rust decoding for selected well-tested Unreal asset classes only when it provides a material advantage over the authoritative Editor bridge, while maintaining exact scope reporting."
depends_on = ["end-to-end-conversion-suite"]
gate = "Approve each new direct decoder asset class, target Unreal versions, fixture provenance, and acceptance cases before implementation. Do not expand into arbitrary cooked/encrypted content by default."
hints = [
    "Use CUE4Parse and UAssetAPI as behavior/reference oracles where their permissive licenses permit study and appropriate attribution. Do not copy GPL FModel code into Vortex-Bevy.",
    "Start only with a concrete approved class such as UTexture2D metadata or a constrained static-mesh representation. Isolate parser logic in a secondary adapter and map immediately to typed canonical data.",
    "Model version support as explicit capability records, not broad version claims. Require companion files, mappings, or build-version facts where the format needs them.",
    "Fuzz every direct binary decoder and enforce byte/depth/count limits. Reject unknown serialization rather than guessing.",
    "Use an independent oracle comparison against authorized source/fixture output for each supported class."
]
test_hints = [
    "For each new decoder class, test valid versions, boundary sizes, malformed bytes, unknown version, missing companion data, and oracle equivalence.",
    "Run cargo-fuzz or equivalent bounded fuzz smoke tests in CI or scheduled workflow without committing proprietary corpus data."
]
must_haves = [
    "Every direct decoder has an explicit version/class support statement",
    "Binary parsing is fuzzed and resource-bounded",
    "GPL code is not copied or linked",
    "Unknown/cooked/encrypted input remains fail-closed by default"
]
evaluation_criteria = [
    "Approved decoder fixture output matches the independent oracle on semantic fields",
    "Malformed decoder corpus produces errors with no panic/timeout/unbounded allocation",
    "Support matrix names exact class/version boundaries"
]

[[phases.tasks]]
slug = "performance-and-observability"
kind = "feature"
title = "Measure, optimize, and observe full conversion/runtime behavior"
goal = "Add evidence-driven performance benchmarks, structured tracing, memory limits, and reproducible diagnostics for the complete pipeline."
depends_on = ["usd-variants-instancing-and-streaming", "direct-asset-decoder-expansion"]
hints = [
    "Benchmark package inspection, stage resolution, IR construction, texture processing, GLB writing, manifest loading, and Bevy scene spawn using owned fixtures of documented sizes.",
    "Use tracing spans keyed by typed ConversionId and redacted source identity. Never log project secrets, environment variables, decryption material, or entire untrusted documents.",
    "Add configuration for bounded concurrency and memory/resource limits. Do not hold a mutex guard across await points; scope non-Send values before asynchronous work.",
    "Use profiling data to target allocations. Prefer consuming iterators when ownership transfers; do not clone whole collections to placate the borrow checker without measuring.",
    "Document performance envelope as tested observations, not guarantees."
]
test_hints = [
    "Benchmark smoke tests establish regression thresholds with generous hardware-aware tolerance.",
    "Test structured logs/reports redact sensitive values and retain ConversionId correlation.",
    "Test configured resource limits reject pathological fixtures predictably."
]
must_haves = [
    "Conversion phases have structured, redacted observability",
    "Hot-path optimizations are benchmark-backed",
    "Resource limits prevent pathological fixture exhaustion",
    "Performance claims are documented as measured conditions"
]
evaluation_criteria = [
    "Benchmark suite runs on owned fixtures and records reproducible metadata",
    "Redaction tests prove sensitive values do not appear in logs or reports",
    "Pathological inputs fail under configured limits with typed diagnostics"
]

# ─── Phase 7: Release, Documentation, and Independent Audits ──────────────────

[[phases]]
name = "Release, Documentation, and Independent Audits"
order = 7

[[phases.tasks]]
slug = "documentation-and-compatibility-matrix"
kind = "feature"
title = "Publish complete architecture, support, operations, and migration documentation"
goal = "Produce the documentation required to use, extend, validate, and operate Vortex-Bevy without reading implementation details."
depends_on = ["performance-and-observability"]
hints = [
    "Document installation, Rust/Bevy/Unreal prerequisites, supported inputs, authorization boundary, CLI reference, profiles, fixture policy, architecture, manifest schema, output layout, troubleshooting, performance limits, and security model.",
    "Publish the compatibility matrix by source class/feature, input route, output route, classification, exact tested versions, caveats, and recommended remediation. Generate its data from the typed support model where practical.",
    "Document the collapsed architecture and consumer-owned-port rule with a concrete code map. Include guidance for adding an adapter without leaking SDK types or new shared traits.",
    "Include Bevy 0.19-specific runtime notes and explain why GLB plus manifest is the runtime contract rather than a claim of native full USD semantics.",
    "Write rustdoc for public library APIs and examples for adapter implementors; run cargo doc --workspace --no-deps with warnings denied."
]
test_hints = [
    "Validate all documented CLI examples against the real binary in CI.",
    "Add a documentation link checker and rustdoc build check.",
    "Test that the generated compatibility matrix agrees with support-matrix CLI output."
]
must_haves = [
    "Docs state exact support boundaries and non-goals",
    "Compatibility matrix is test-backed",
    "Public APIs have rustdoc and examples where appropriate",
    "CLI examples execute successfully"
]
evaluation_criteria = [
    "No documentation promises Blueprint/C++ or arbitrary cooked-content equivalence",
    "Every documented command is executed in an automated documentation test",
    "cargo doc --workspace --no-deps passes with denied warnings"
]

[[phases.tasks]]
slug = "release-hardening"
kind = "audit"
title = "Perform release hardening, reproducibility verification, and supply-chain review"
goal = "Audit the complete workspace for release readiness across correctness, provenance, reproducibility, security, licensing, and platform behavior."
depends_on = ["documentation-and-compatibility-matrix"]
hints = [
    "Run full clean-room reproducibility checks: clean workspace, generate artifacts twice on supported platforms where possible, compare manifest/GLB checksums, and document permitted platform-specific differences if any.",
    "Review Cargo.lock, deny.toml, cargo audit, licenses, GitHub Action pinning, dependency features, unsafe-code policy, fixture provenance, path handling, subprocess invocation, artifact publication, and diagnostic redaction.",
    "Use cargo geiger or an equivalent review to identify unsafe dependencies; Vortex production code remains #![forbid(unsafe_code)] unless a narrowly approved adapter requires otherwise with documented safety proof.",
    "Exercise release builds for supported targets and headless verification mode. Validate app behavior without network access after dependencies are fetched.",
    "Prepare semver/versioning, CHANGELOG, release notes, known limitations, signed artifact/checksum policy, and recovery/rollback guidance."
]
test_hints = [
    "Run clean build, full tests, strict lint, deny, audit, documentation, and end-to-end fixtures from a fresh checkout.",
    "Run a release artifact smoke test on every CI target.",
    "Run a fixture provenance audit and secret scan as release blockers."
]
must_haves = [
    "Release checklist is automated where possible and fully documented",
    "Reproducibility results are recorded",
    "Dependency/security/license reports are clean or explicitly reviewed",
    "Known limitations and support matrix ship with release notes"
]
evaluation_criteria = [
    "Fresh-checkout preflight succeeds on supported CI targets",
    "Release fixture artifacts meet checksum reproducibility policy",
    "No secret, key, prohibited fixture, GPL-linked component, or undocumented unsafe block remains",
    "Release notes accurately state supported and unsupported capability boundaries"
]

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Each entry must record why the affected code cannot be reached in this build and
# what upstream change removes the need for it. Re-check on every dependency bump.
ignore = [
    # RUSTSEC-2026-0344 — decompression bomb in `ruzstd` 0.8.3.
    #
    # `bevy_egui` requests `bevy_image/zstd_rust`, which pulls `ruzstd` into the
    # graph. `ruzstd` is only *called* from `bevy_image::ktx2`, gated behind the
    # `bevy_image/ktx2` feature. Nothing here enables that feature, so the
    # vulnerable decoder is not compiled in; `nm` over the built
    # `libbevy_image-*.rlib` and the linked binary report zero `ruzstd` symbols.
    # This workspace also never decodes zstd; textures are normalized to PNG.
    #
    # The fix (ruzstd 0.9.1) conflicts with bevy_image 0.20.0's `^0.8.0`
    # requirement and cannot be selected. Drop this entry once Bevy bumps
    # `ruzstd` to >=0.9.1. Mirrored in `.cargo/audit.toml` for `cargo audit`.
    { id = "RUSTSEC-2026-0344", reason = "ruzstd is compiled but unreachable: its only caller, bevy_image::ktx2, sits behind the disabled bevy_image/ktx2 feature. Fix requires bevy_image to allow ruzstd >=0.9.1." },
]

[licenses]
version = 2
allow = ["MIT", "MIT-0", "Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "CC0-1.0", "Zlib", "BSL-1.0", "OFL-1.1", "Ubuntu-font-1.0"]
confidence-threshold = 0.8
private = { ignore = true }

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

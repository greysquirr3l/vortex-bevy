name: Deploy book

# Deploys the MDBook user guide to GitHub Pages on every push to main
# that touches book/ content. Triggers can also be invoked manually via
# the Actions tab (workflow_dispatch).
on:
  push:
    branches: [main]
    paths:
      - "book/**"
      - ".github/workflows/book.yml"
  workflow_dispatch:

# Avoid overlapping deployments; keep the in-flight run alive to finish.
concurrency:
  group: pages
  cancel-in-progress: false

# Pages deployment needs write access to Pages and an OIDC token for the
# official deploy-pages action. The deployment URL is captured from the
# deploy step and exposed via the job's `environment.url`.
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    name: Build and deploy book
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install mdbook
        # Pinned version matches the local install documented in the book.
        # `cargo install --locked` honors Cargo.lock so the dependency graph
        # is reproducible across CI runs.
        shell: bash
        run: |
          if ! command -v mdbook >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --profile minimal
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            cargo install mdbook --locked --version 0.5.4
          fi

      - name: Build book
        # Static HTML is emitted under book/build/. Gitignored.
        shell: bash
        run: mdbook build book/

      - name: Verify mdbook test
        # Catches broken intra-doc links and missing examples that build alone
        # would skip. Failures here fail the deployment.
        shell: bash
        run: mdbook test book/

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./book/build
          # v4 stopped shipping hidden files by default, but mdbook writes
          # `.nojekyll` into the build directory to tell GitHub Pages to
          # skip Jekyll processing. Opt back in so the deployed site keeps
          # the same contents as the v3 upload.
          include-hidden-files: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

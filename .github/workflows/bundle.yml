name: Release bundle

# Builds per-platform application bundles on every semver tag push
# (`v*`) and attaches them to a GitHub Release named after the tag.
#
# Triggers:
#   - push of a `v*` tag (e.g. v0.1.0, v1.2.3-rc.1)
#   - workflow_dispatch (manual run, with an explicit tag input)
#
# The workflow is independent of `ci.yml` so a release build can be
# reproduced without paying for the full quality matrix on every tag.
# Release artifacts are produced by `cargo bundle --release`, which
# reads `[package.metadata.bundle]` from `crates/vortex-bevy/Cargo.toml`.
#
# Out of scope:
#   - Arch Linux AUR (the AUR ecosystem is currently compromised by fake
#     packages; the project will not publish there until that is resolved)
#   - macOS / Windows code signing (cert handling belongs in a separate
#     signing workflow gated on repository secrets)
#   - Per-distro apt/yum repository uploads (the .deb and .rpm artifacts
#     produced here are unsigned and intended for local installation via
#     `dpkg -i` / `rpm -i`; distro-repo publication is a separate concern)
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.1.0)"
        required: true
        type: string

# Tag-driven releases must serialize — overlapping tag builds would
# race on the GitHub Release resource.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  # Releases also need write access to create the release + upload
  # assets. The CI workflow uses `contents: read` because it only
  # builds; this workflow mutates release state.

jobs:
  bundle:
    name: Bundle (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            # actions/upload-artifact does not brace-expand, so list each
            # bundle directory explicitly. Each entry accepts a glob.
            #
            # AppImage is intentionally omitted: `cargo bundle` only
            # emits an `.AppImage` when `appimagetool` is on PATH, and
            # the actionlint runners do not ship it. AppImage remains a
            # local-developer format (see book/src/how-to/bundle.md).
            artifact_paths: |
              target/release/bundle/deb/*.deb
              target/release/bundle/rpm/*.rpm
            artifact_name: "vortex-bevy-linux-x86_64"
          - os: macos-14
            artifact_paths: "target/release/bundle/osx/Vortex-Bevy.app"
            artifact_name: "vortex-bevy-macos-universal"
            # macOS-14 runners are arm64; cargo-bundle produces a native
            # arm64 .app. Universal binaries would require an explicit
            # lipo step that is out of scope for this workflow.
          - os: windows-latest
            # cargo-bundle's Windows emitters are both broken:
            #   * MSI: GitHub burtonageo/cargo-bundle#77 (Windows MSI
            #     error) and #221 (Windows bundling failing in GH
            #     Actions). The MSI keypath column also rejects
            #     hyphens in the binary name, which `vortex-bevy` hits.
            #   * exe: cargo-bundle's exe emitter tries to embed
            #     an icon + version resources into the PE binary via
            #     `winres_edit`, which fails with WIN32_ERROR(1812)
            #     `ERROR_RESOURCE_DATA_NOT_FOUND` when the source
            #     binary has no resource section (the default rustc
            #     release output).
            # The Windows matrix leg therefore does NOT run
            # cargo-bundle. It uploads the raw release executable
            # produced by `cargo build --release`, which is already a
            # self-contained PE binary that runs on any Windows host with
            # no installer. Icon embedding for Windows is a future task
            # (post-build PE edit with `winres` or `cargo-packager`).
            artifact_paths: "target/release/vortex-bevy.exe"
            artifact_name: "vortex-bevy-windows-x86_64"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.97.1

      - name: Install cargo-bundle
        # The version is pinned explicitly. cargo-bundle v0.12 parses the
        # bundle metadata table with `deny_unknown_fields` and moved the
        # macOS-specific keys under a typed `[osx]` sub-table, so the
        # manifest in crates/vortex-bevy/Cargo.toml only builds against
        # that version. An unpinned install would break the release
        # whenever cargo-bundle changes its schema again.
        #
        # Skipped on Windows: cargo-bundle's Windows emitters are both
        # broken (see the windows-latest matrix entry above).
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            echo "Skipping cargo-bundle on Windows (both MSI and exe emitters broken; see artifact_paths rationale)"
          else
            cargo install cargo-bundle --version 0.12.0 --locked
          fi

      - name: Build release binary
        shell: bash
        run: cargo build --release --bin vortex-bevy -p vortex-bevy

      - name: Build disk budget
        # The runner runs out of disk during the link step and fails with a
        # bus error that points at the linker rather than at the disk. This
        # fails with a message that names the cause.
        shell: bash
        run: bash scripts/check-build-disk.sh

      - name: Build platform bundle
        # Linux + macOS use cargo-bundle. Windows skips it (the Windows
        # matrix leg uploads the raw release `.exe` instead).
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            echo "Skipping cargo-bundle on Windows; uploading raw release binary"
          else
            cargo bundle --release --bin vortex-bevy -p vortex-bevy
          fi

      - name: List produced artifacts
        # Make the produced file list visible in the job log so a failed
        # upload (glob matched zero files) is diagnosable from the UI
        # without re-running locally.
        shell: bash
        run: |
          set -euo pipefail
          echo "Bundle output for ${{ matrix.os }}:"
          ls -la target/release/bundle/

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_paths }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: bundle
    runs-on: ubuntu-latest
    # `contents: write` is declared at the workflow scope; the matrix
    # jobs only need read access to checkout.
    permissions:
      contents: write
    steps:
      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download all bundle artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts

      - name: Verify every artifact is present
        # download-artifact would silently produce an empty directory if
        # the matrix was misconfigured. Fail fast with a useful error
        # instead of pushing a release with missing assets.
        shell: bash
        run: |
          set -euo pipefail
          found=0
          for dir in artifacts/*/; do
            if [ -d "$dir" ] && [ -n "$(ls -A "$dir" 2>/dev/null || true)" ]; then
              found=$((found + 1))
              echo "artifact dir: $dir"
              ls -la "$dir"
            fi
          done
          if [ "$found" -lt 3 ]; then
            echo "expected at least 3 artifact dirs (linux/macos/windows), got $found" >&2
            exit 1
          fi

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          # The action names this input `tag_name`. Passing `tag` is an
          # unknown input: the action ignores it and falls back to
          # `github.ref_name`, so a manual dispatch would publish the
          # release against the branch instead of the requested tag.
          tag_name: ${{ steps.tag.outputs.tag }}
          # Draft so a maintainer can edit the body / verify checksums
          # before publishing. Use workflow_dispatch with a non-draft
          # input or push the release live from the UI.
          draft: true
          generate_release_notes: true
          files: |
            artifacts/**/*.deb
            artifacts/**/*.rpm
            artifacts/**/*.AppImage
            artifacts/**/*.app/**
            artifacts/**/*.msi
            artifacts/**/*.exe
      - name: Summary
        if: success()
        shell: bash
        run: |
          echo "Release ${{ steps.tag.outputs.tag }} created as a draft."
          echo "Visit ${{ github.server_url }}/${{ github.repository }}/releases"
          echo "to verify the bundled artifacts and publish the release."

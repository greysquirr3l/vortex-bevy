name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.97.1
          components: clippy, rustfmt
      - name: Build
        run: cargo build --workspace --all-targets --all-features
      - name: Test
        run: cargo test --workspace --all-features
      - name: Format
        run: cargo fmt --all -- --check
      - name: Strict Clippy
        run: cargo l
      - name: Install mdbook
        run: cargo install --locked mdbook --version 0.5.4
      - name: Documentation contract
        run: bash scripts/check-documentation.sh

  bridge-quality:
    name: Authorized Editor bridge quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "8.0.x"
      - name: Install pinned bridge lint tools
        run: python -m pip install ruff==0.14.3 gdtoolkit==4.2.2 pytest==8.3.5 jsonschema==4.23.0
      - name: Validate authorized Editor bridges
        run: bash scripts/check-bridge-quality.sh

  supply-chain:
    name: Supply chain and fixture policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.97.1
      - name: Install cargo-deny and cargo-audit
        run: cargo install --locked cargo-deny cargo-audit
      - name: Dependency policy
        run: cargo deny --all-features check
      - name: Vulnerability audit
        run: cargo audit
      - name: Fixture provenance policy
        run: bash scripts/check-fixture-policy.sh
      - name: Fixture contract verification
        run: bash scripts/verify-fixtures.sh

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # The ubuntu runner has roughly 14 GB of free disk. A default debug build
  # of this workspace is 12 GB, and `cargo test` and `cargo l` add their own
  # artifacts on top, so the runner runs out of disk partway through the
  # link step and fails with "ld terminated with signal 7 [Bus error]".
  # Stripping debuginfo and disabling incremental compilation brings the
  # build to 7.5 GB, which fits, and it is also faster to link.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_INCREMENTAL: "0"

jobs:
  quality:
    name: Quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.97.1
          components: clippy, rustfmt
      - name: Probe graphics environment
        if: matrix.os == 'ubuntu-latest'
        run: |
          echo "=== vulkan ICDs ==="
          find /usr/share/vulkan/icd.d/ 2>&1 || true
          echo "=== mesa packages ==="
          dpkg -l 2>/dev/null | grep -iE "mesa|vulkan" | head -20 || true
          echo "=== apt candidates ==="
          apt-cache policy mesa-vulkan-drivers 2>&1 | head -5 || true
          apt-cache policy libgl1-mesa-dri 2>&1 | head -5 || true
          echo "=== vulkaninfo ==="
          (command -v vulkaninfo && vulkaninfo --summary 2>&1 | head -30) || echo "no vulkaninfo"
          echo "=== dri drivers ==="
          find /usr/lib/x86_64-linux-gnu/dri/ -maxdepth 1 2>&1 | head -10 || true
      - name: Build
        run: cargo build --workspace --all-targets --all-features
      - name: Build disk budget
        # The runner runs out of disk during the link step and fails with a
        # bus error that points at the linker rather than at the disk. This
        # fails with a message that names the cause.
        run: bash scripts/check-build-disk.sh
      - name: Test
        run: cargo test --workspace --all-features
      - name: Format
        run: cargo fmt --all -- --check
      - name: Strict Clippy
        run: cargo l
      - name: Install mdbook
        run: cargo install --locked mdbook --version 0.5.4
      - name: Documentation contract
        run: bash scripts/check-documentation.sh
      - name: Workflow action contract
        # Resolves each pinned action's action.yml and checks that every
        # `with:` key names a declared input and that no required input is
        # missing. actionlint does not resolve remote actions, so it cannot
        # catch either mistake.
        run: bash scripts/check-workflow-actions.sh
      - name: Workflow action contract tests
        run: bash scripts/test-workflow-actions.sh
      - name: Branch protection contract
        # The required status checks must name the CI job display names.
        # A check that names a job id never reports a result, which leaves
        # the pull request blocked even when every job passes. The default
        # GITHUB_TOKEN cannot read branch protection, so this compares the
        # workflow against the recorded expectations.
        run: bash scripts/check-branch-protection.sh

  bridge-quality:
    name: Authorized Editor bridge quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "8.0.x"
      - name: Install pinned bridge lint tools
        # gdtoolkit 4.2.2 still imports `pkg_resources`, which setuptools 81
        # removed and Python 3.12 no longer bundles. Pin setuptools below 81
        # so `pkg_resources` stays importable. This keeps gdtoolkit on 4.2.2:
        # 4.5.0 declares setuptools itself but also reformats
        # bridges/godot/vortex_godot_bridge.gd, so moving to it means
        # reformatting the bridge in the same change.
        run: >-
          python -m pip install
          ruff==0.14.3
          gdtoolkit==4.2.2
          "setuptools<81"
          pytest==8.3.5
          jsonschema==4.23.0
      - name: Validate authorized Editor bridges
        run: bash scripts/check-bridge-quality.sh

  supply-chain:
    name: Supply chain and fixture policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.97.1
      - name: Install cargo-deny and cargo-audit
        run: cargo install --locked cargo-deny cargo-audit
      - name: Dependency policy
        run: cargo deny --all-features check
      - name: Vulnerability audit
        run: cargo audit
      - name: Fixture provenance policy
        run: bash scripts/check-fixture-policy.sh
      - name: Fixture contract verification
        run: bash scripts/verify-fixtures.sh

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

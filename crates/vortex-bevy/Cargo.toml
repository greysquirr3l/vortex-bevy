[package]
name = "vortex-bevy"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow.workspace = true
# `bevy_winit` and `bevy_log` are required, not optional. Bevy's
# `DefaultPlugins` only installs `WinitPlugin` and `LogPlugin` when the
# matching features are enabled; without `bevy_winit` the viewer has no
# event loop and never opens a native window. `build_runtime_app` calls
# `disable::<WinitPlugin>()` and `disable::<LogPlugin>()`, which panic when
# the plugin is absent from the group, so both features must stay enabled.
bevy = { workspace = true, features = ["bevy_asset", "bevy_scene", "bevy_gltf", "bevy_pbr", "bevy_picking", "bevy_winit", "tonemapping_luts", "png", "bevy_log"] }
bevy_egui.workspace = true
bevy_winit.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
vortex-core = { path = "../vortex-core", version = "0.2.0" }

[dev-dependencies]
criterion.workspace = true

[[bench]]
name = "runtime_spawn"
harness = false

# Cross-platform bundle metadata consumed by `cargo bundle --release`.
# Produces:
#   - macOS:   target/release/bundle/osx/Vortex-Bevy.app + .dmg
#   - Windows: target/release/bundle/windows/vortex-bevy.msi
#   - Linux:   target/release/bundle/{deb,rpm,AppImage}/vortex-bevy_*
#
# cargo-bundle v0.12 reads per-binary settings from
# `[package.metadata.bundle.bin.<name>]`. Settings at the
# top-level `[package.metadata.bundle]` are ignored when
# `--bin <name>` is passed to cargo-bundle (which is what the
# `.github/workflows/bundle.yml` workflow does), so the actual
# metadata lives under the `.bin.vortex-bevy` table below.
[package.metadata.bundle.bin.vortex-bevy]
name = "Vortex-Bevy"
version = "0.2.0"
identifier = "dev.greysquirr3l.vortex-bevy"
category = "DeveloperTool"
short_description = "Authorized Unreal Engine and OpenUSD asset conversion to deterministic Bevy 0.20 runtime artifacts."
long_description = "Vortex-Bevy is an offline CLI plus an optional Bevy 0.20 desktop viewer for authorized Unreal Engine source-project assets, Unity URP static scenes, and selected OpenUSD stages."
# Bundle icon paths. cargo-bundle v0.12 picks the best format per platform
# automatically (.icns on macOS, .ico on Windows, .png on Linux) from a
# single `icon` array. Files live under crates/vortex-bevy/assets/bundle/
# and are read at bundle-build time from the workspace root.
icon = [
    "crates/vortex-bevy/assets/bundle/vortex-bevy.icns",
    "crates/vortex-bevy/assets/bundle/vortex-bevy.ico",
    "crates/vortex-bevy/assets/bundle/vortex-bevy-512.png",
    "crates/vortex-bevy/assets/bundle/vortex-bevy-128.png",
]
# cargo-bundle v0.12 parses this table with `deny_unknown_fields`, so
# every key here must be one the crate declares. The homepage, publisher,
# and license fields that older cargo-bundle versions ignored are read from
# the package's own `homepage` and `license` metadata instead, and the
# macOS-specific keys moved under the typed `[osx]` sub-table.
[package.metadata.bundle.bin.vortex-bevy.osx]
frameworks = []
minimum_system_version = "11.0"

[lints]
workspace = true
